name: Build AIDB Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Main index.html to www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Build Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Convert & Generate App Icon and Splash from Logo
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "assets/logo.jpeg" ]; then
            convert assets/logo.jpeg assets/logo.png
          elif [ -f "assets/logo.jpg" ]; then
            convert assets/logo.jpg assets/logo.png
          fi
          if [ -f "assets/logo.png" ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          fi

      - name: Inject Hardware & Security Permissions
        run: |
          PERMISSIONS='<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>'
          sed -i "s|<uses-permission android:name=\"android.permission.INTERNET\" \/>|$PERMISSIONS|g" android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload AIDB APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIDB-Sovereign-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
